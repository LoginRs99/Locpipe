[project]
name = "locpipe"
version = "2.0.0"
description = "Deterministic, multi-project localization pipeline. LLM translates and repairs; Python does everything else."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "polib>=1.2",
    "anyio>=4.0",
    "pyspellchecker>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0",
]
unity-preflight = [
    "UnityPy>=1.10",
]

[project.scripts]
locpipe = "locpipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["locpipe*"]

[tool.setuptools.package-data]
locpipe = ["agents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]

